services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8000
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${GCP_PROJECT_ID}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${GCP_PROJECT_ID}.firebaseapp.com
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - gateway
    networks:
      - ecopulse

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore:8080
      - REDIS_URL=redis://redis:6379
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - AGENTS_URL=http://agents:8001
    volumes:
      - ./services/gateway:/app
    depends_on:
      - firestore
      - redis
      - agents
    networks:
      - ecopulse

  agents:
    build:
      context: ./services/agents
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENV=development
    volumes:
      - ./services/agents:/app
      - ./packages:/app/packages
    depends_on:
      - redis
    networks:
      - ecopulse

  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8080
      --project=demo-ecopulse
    ports:
      - "8080:8080"
    networks:
      - ecopulse

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - ecopulse

networks:
  ecopulse:
    driver: bridge
